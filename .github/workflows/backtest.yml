name: backtest

# Backtesting lab, stock playbooks: SWING (about two years, 1D structure with 1H trigger) and POSITIONAL (about ten years of daily history,
# weekly structure with daily trigger), each replayed with the live engine and the live trade tracker. Runs every Saturday morning, or by hand.
# INTRADAY and NIFTY OPTIONS are in the `backtest-intraday` workflow. Quick mode re-applies your account rules to all four saved results in about a minute.
# The 250 most liquid Nifty 500 stocks take roughly 30-45 minutes for swing and about 10 for positional; all 500 take about twice that.
on:
  schedule:
    - cron: '30 1 * * 6'               # Saturday 07:00 IST
  workflow_dispatch:
    inputs:
      top:
        description: How many of the most liquid Nifty 500 stocks (0 = all)
        default: '250'
      variants:
        description: Also test the rule variants (volume, stop buffer, zone width) on the 120 most liquid stocks
        type: boolean
        default: true
      positional:
        description: Also run the positional backtest (weekly structure, daily trigger, about ten years of history)
        type: boolean
        default: true
      quick:
        description: Quick mode (about 1 minute) - only re-apply your account rules to the trades saved by the last full runs (all four playbooks)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare
        run: |
          python publish.py prepare pub
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Replay
        env:
          PYTHONWARNINGS: ignore
          TOP_IN: ${{ inputs.top }}
          VAR_IN: ${{ inputs.variants }}
          QUICK_IN: ${{ inputs.quick }}
          POS_IN: ${{ inputs.positional }}
          STOP_AFTER_LOSSES: ${{ vars.STOP_AFTER_LOSSES }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          RISK_PCT_APLUS: ${{ vars.RISK_PCT_APLUS }}
          OPEN_RISK_CAP: ${{ vars.OPEN_RISK_CAP }}
          DAY_STOP_PCT: ${{ vars.DAY_STOP_PCT }}
          WEEK_STOP_PCT: ${{ vars.WEEK_STOP_PCT }}
          MONTH_HALF_PCT: ${{ vars.MONTH_HALF_PCT }}
          MONTH_STOP_PCT: ${{ vars.MONTH_STOP_PCT }}
          MAX_TRADES_PER_DAY: ${{ vars.MAX_TRADES_PER_DAY }}
        run: |
          if [ "$QUICK_IN" = "true" ]; then python backtest.py --resim --out pub/data; exit 0; fi
          top="${TOP_IN:-250}"; extra="--variants"
          if [ "$VAR_IN" = "false" ]; then extra=""; fi
          python backtest.py --out pub/data --top "$top" $extra
          if [ "$POS_IN" != "false" ]; then python backtest.py --segment positional --out pub/data --top "$top"; fi
      - name: Publish
        run: python publish.py push pub "$START" "backtest"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tell the phone
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: ${{ vars.PAGE_URL }}
          STATUS: ${{ job.status }}
        run: python backtest.py --out pub/data --notify "$STATUS"
